    />

    <script>
      (function () {
        var t = localStorage.getItem('theme');
        var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (t === 'dark' || (!t && sysDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <div id="root"></div>
