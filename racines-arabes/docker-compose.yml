# Stack complete — projet racines-arabes
# Pilote via le Makefile : make build / make up / make down

services:
  mongo:
    image: mongo:7
    container_name: racines-arabes-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service one-shot : peuple la base puis se termine
  seed:
    build: ./backend
    container_name: racines-arabes-seed
    command: npm run seed
    environment:
      MONGO_URI: mongodb://mongo:27017/racines-arabes
      JWT_SECRET: dev_secret_local
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    container_name: racines-arabes-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/racines-arabes
      JWT_SECRET: dev_secret_local
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./backend/src:/app/src
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: racines-arabes-frontend
    ports:
      - "5173:5173"
    environment:
      # Le proxy Vite cible le service backend dans le reseau Docker
      VITE_PROXY_TARGET: http://backend:5000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  mongo-data:
